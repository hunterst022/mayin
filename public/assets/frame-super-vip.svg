<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6d00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9100;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Ring -->
  <circle cx="120" cy="130" r="95" fill="none" stroke="url(#gold)" stroke-width="12" filter="url(#gold-glow)"/>
  <circle cx="120" cy="130" r="82" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <circle cx="120" cy="130" r="105" fill="none" stroke="#ffab00" stroke-width="1" opacity="0.6"/>
  
  <!-- Laurel Leaves Left -->
  <g fill="url(#gold)">
    <path d="M 25 130 C 15 100 10 70 40 50 C 45 80 40 105 25 130" filter="url(#gold-glow)"/>
    <path d="M 30 160 C 15 135 15 105 45 85 C 50 115 40 140 30 160" />
    <path d="M 45 190 C 25 170 30 140 65 125 C 65 155 50 180 45 190" />
  </g>
  
  <!-- Laurel Leaves Right -->
  <g fill="url(#gold)">
    <path d="M 215 130 C 225 100 230 70 200 50 C 195 80 200 105 215 130" filter="url(#gold-glow)"/>
    <path d="M 210 160 C 225 135 225 105 195 85 C 190 115 200 140 210 160" />
    <path d="M 195 190 C 215 170 210 140 175 125 C 175 155 190 180 195 190" />
  </g>
  
  <!-- Crown at Top -->
  <g transform="translate(0, 10)">
    <path d="M 85 45 L 95 10 L 120 30 L 145 10 L 155 45 Z" fill="url(#gold)" filter="url(#gold-glow)" />
    <circle cx="95" cy="5" r="6" fill="#fff" filter="url(#gold-glow)" />
    <circle cx="145" cy="5" r="6" fill="#fff" filter="url(#gold-glow)"/>
    <circle cx="120" cy="20" r="7" fill="#ff1744" filter="url(#gold-glow)"/>
    <rect x="90" y="47" width="60" height="8" rx="4" fill="#ff3d00" />
  </g>

  <!-- Sparkles -->
  <path d="M 120 230 L 122 238 L 130 240 L 122 242 L 120 250 L 118 242 L 110 240 L 118 238 Z" fill="#fff" filter="url(#gold-glow)" transform="translate(0, -10)" />
</svg>
