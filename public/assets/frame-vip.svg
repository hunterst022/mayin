<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e040fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#651fff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="8" filter="url(#glow)"/>
  <!-- Inner thin ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#ea80fc" stroke-width="2" opacity="0.9"/>
  <!-- Elegant flourishes Left -->
  <path d="M 15 100 C 5 80 10 50 35 40 C 25 65 25 85 15 100" fill="url(#grad1)" filter="url(#glow)"/>
  <path d="M 20 130 C 5 110 5 80 30 70 C 25 95 30 115 20 130" fill="url(#grad1)" opacity="0.8"/>
  <!-- Elegant flourishes Right -->
  <path d="M 185 100 C 195 80 190 50 165 40 C 175 65 175 85 185 100" fill="url(#grad1)" filter="url(#glow)"/>
  <path d="M 180 130 C 195 110 195 80 170 70 C 175 95 170 115 180 130" fill="url(#grad1)" opacity="0.8"/>
</svg>
